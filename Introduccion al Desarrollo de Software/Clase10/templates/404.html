{% extends "base.html" %}

{% block title %}Página no encontrada{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-content">
        <h1>404</h1>
        <h2>Página no encontrada</h2>
        <p class="error-description">
            Lo sentimos, la página que estás buscando no existe.
        </p>
        <div class="error-actions">
            <a href="{{ url_for('index') }}" class="btn btn-primary">
                Volver al inicio
            </a>
        </div>
    </div>
</div>

<style>
    .error-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 70vh;
        padding: 2rem;
        text-align: center;
    }
    
    .error-content h1 {
        font-size: 5rem;
        color: #6c757d;
        margin-bottom: 1rem;
    }
    
    .error-content h2 {
        font-size: 2rem;
        margin-bottom: 1.5rem;
    }
    
    .error-description {
        font-size: 1.2rem;
        margin-bottom: 2rem;
    }
    
    .btn-primary {
        padding: 10px 20px;
        background-color: #007bff;
        color: white;
        text-decoration: none;
        border-radius: 5px;
    }
</style>
{% endblock %}
